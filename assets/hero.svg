<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Safe Duplicate Cleaner</title>
  <desc id="desc">Preview First. Complete Folders First. Quarantine, Never Delete.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10202e"/><stop offset="1" stop-color="#152e36"/></linearGradient></defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
    <text x="58" y="67" fill="#70dbc1" font-size="15" letter-spacing="3">SAFE DUPLICATE CLEANER</text>
    <text x="55" y="141" fill="#f1f5f9" font-size="36" font-weight="700">Preserve Complete Folders First.</text>
    <text x="58" y="186" fill="#adc1ca" font-size="19">Zero data loss duplicate cleaner for engineers &amp; researchers.</text>
    <g font-size="14" fill="#d7e9e7">
      <rect x="58" y="237" width="130" height="39" rx="19" fill="#25424b"/><text x="82" y="261">Preview First</text>
      <rect x="202" y="237" width="180" height="39" rx="19" fill="#25424b"/><text x="222" y="261">Complete Folders First</text>
      <rect x="396" y="237" width="155" height="39" rx="19" fill="#25424b"/><text x="416" y="261">Quarantine Only</text>
    </g>
